name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import project assets
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/ChessVerse3D.apk
          test -s build/ChessVerse3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVerse3D-Android-debug
          path: build/ChessVerse3D.apk
          if-no-files-found: error
          retention-days: 14
