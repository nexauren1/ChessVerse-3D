name: Validate Godot project

# Validation is manual while old long-running jobs are cleared.
# Android APK builds remain automatically triggered by build-android.yml.
concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import project and parse scripts
        run: timeout --signal=TERM --kill-after=5s 30s godot --headless --editor --path . --quit

      - name: Test chess rules and AI
        run: timeout --signal=TERM --kill-after=5s 30s godot --headless --path . --script res://tests/chess_rules_test.gd

      - name: Run main scene headlessly
        run: timeout --signal=TERM --kill-after=5s 20s godot --headless --path . --quit-after 12
