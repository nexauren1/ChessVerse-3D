name: Validate Godot project

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "tests/**"
      - "assets/models/**"
      - ".github/workflows/validate-godot.yml"
  pull_request:
    branches: [main]
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "tests/**"
      - "assets/models/**"
      - ".github/workflows/validate-godot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import project and parse scripts
        run: timeout 60s godot --headless --editor --path . --quit

      - name: Test chess rules and AI
        run: timeout 45s godot --headless --path . --script res://tests/chess_rules_test.gd

      - name: Run main scene headlessly
        run: timeout 30s godot --headless --path . --quit-after 12
