name: Validate Godot project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Run main scene headlessly
        run: godot --headless --path . --quit-after 12
