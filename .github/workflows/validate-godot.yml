name: ChessVerse 3D - Validate and Build

concurrency:
  group: chessverse-main-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "scripts/**"
      - "scenes/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/validate-godot.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Cancel previous workflow executions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel every other queued or running execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          runs_json=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100")
          printf '%s' "$runs_json" | jq -r --arg current "$GITHUB_RUN_ID" '
            .workflow_runs[]
            | select(
                (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending" or .status == "requested")
                and ((.id | tostring) != $current)
              )
            | .id
          ' | while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "Cancelling previous workflow run $run_id"
            http_code=$(curl -sS -o /tmp/cancel-run.json -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel")
            echo "Run $run_id cancellation response: HTTP $http_code"
          done

  validate-and-build:
    name: Validate game and export Android APK
    needs: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import project and parse scripts
        run: timeout --signal=TERM --kill-after=5s 45s godot --headless --editor --path . --quit

      - name: Test chess rules and AI
        run: timeout --signal=TERM --kill-after=5s 45s godot --headless --path . --script res://tests/chess_rules_test.gd

      - name: Run main scene headlessly
        run: timeout --signal=TERM --kill-after=5s 20s godot --headless --path . --quit-after 12

      - name: Install matching Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Install required Android SDK packages and configure signing
        run: |
          JAVA_PATH="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")}"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          command -v sdkmanager
          yes | sdkmanager --sdk_root="$SDK_PATH" --licenses
          sdkmanager --sdk_root="$SDK_PATH" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
          test -x "$JAVA_PATH/bin/java"
          test -x "$SDK_PATH/platform-tools/adb"
          test -x "$SDK_PATH/build-tools/34.0.0/apksigner"
          test -d "$SDK_PATH/platforms/android-34"
          test -d "$SDK_PATH/ndk/23.2.8568313"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          # Persist SDK/JDK paths for every later GitHub Actions step.
          echo "JAVA_HOME=$JAVA_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          # Godot 4.3 reads Android debug-signing credentials from these environment variables.
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "Using Java: $JAVA_PATH"
          echo "Using Android SDK: $SDK_PATH"
      - name: Import assets for Android export
        run: timeout 120s godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          timeout 10m godot --headless --verbose --path . --export-debug "Android" build/ChessVerse3D.apk
          test -s build/ChessVerse3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVerse3D-Android-debug
          path: build/ChessVerse3D.apk
          if-no-files-found: error
          retention-days: 14
